name: Build test APK

# Push the project to GitHub and this runs on GitHub's runners — no local
# Android SDK, no Flutter install, no signing setup. You get a downloadable
# app-debug.apk in roughly 5–8 minutes.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android host project
        # flutter create writes android/ (and ios/) around the existing lib/.
        # It also rewrites pubspec.yaml and drops in its own widget test, so
        # the pubspec is restored and the sample test removed afterwards.
        run: |
          cp pubspec.yaml pubspec.original.yaml
          flutter create --org com.lumen --project-name lumen --platforms=android .
          cp pubspec.original.yaml pubspec.yaml
          rm -f pubspec.original.yaml
          rm -f test/widget_test.dart

      - name: Raise compileSdk for current plugins
        # image_picker / share_plus pull in AndroidX libraries that require
        # compileSdk 34+. Flutter's template still generates 33.
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$f"
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/' "$f"
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 23/' "$f"
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 23/' "$f"
            echo "--- $f"
            grep -nE "compileSdk|minSdk" "$f" || true
          done

      - name: Disable release lint
        # image_picker_android trips a known Android lint crash
        # ('List.removeLast()' in CommentDetector) on lintVitalRelease.
        run: |
          set -e
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            if [ "${f##*.}" = "kts" ]; then
              sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$f"
            else
              sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }/' "$f"
            fi
            echo "--- $f"; sed -n '/^android {/,/^    }/p' "$f" | head -8
          done

      - name: Install packages
        run: flutter pub get

      - name: Analyze (report only)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          echo "exit=$?" >> analyze.txt
          tail -40 analyze.txt
          exit 0

      - name: Build debug APK
        # No pipe here: a piped command reports the exit status of the pipe's
        # last stage, which would hide a failed build.
        run: flutter build apk --debug

      - name: Build release APK
        # The Flutter template signs release builds with the debug keystore, so
        # this installs anywhere. Fine for testing, not for the Play Store.
        run: flutter build apk --release

      - name: Show what was produced
        if: always()
        run: |
          find build -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "no apk directory"

      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-report
          path: analyze.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
